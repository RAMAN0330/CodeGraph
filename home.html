<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeFlow — Read your repo like a graph</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%233fb950'><path d='M5 5.372v.878c0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75v-.878a2.25 2.25 0 1 1 1.5 0v.878a2.25 2.25 0 0 1-2.25 2.25h-1.5v2.128a2.251 2.251 0 1 1-1.5 0V8.5h-1.5A2.25 2.25 0 0 1 3.5 6.25v-.878a2.25 2.25 0 1 1 1.5 0ZM5 3.25a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm6.75.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm-3 8.75a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z'/></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Design Tokens ─────────────────────────────────────────────── */
:root {
  --bg:       #0d1117;
  --bg-1:     #161b22;
  --bg-2:     #1c2128;
  --bg-3:     #262c36;
  --bg-4:     #2d333b;
  --panel:    rgba(13,17,23,0.92);

  --fg:       #e6edf3;
  --fg-2:     #c9d1d9;
  --fg-3:     #8b949e;
  --fg-4:     #484f58;

  --accent:   #3fb950;
  --accent-2: #2ea043;
  --info:     #58a6ff;
  --magenta:  #bc8cff;
  --danger:   #f85149;
  --warning:  #d29922;

  --line:         rgba(48,54,61,0.8);
  --line-strong:  rgba(48,54,61,1);

  --mono: 'JetBrains Mono', monospace;
  --sans: 'Inter', system-ui, sans-serif;

  --radius-sm: 6px;
  --radius:    10px;
  --radius-lg: 14px;

  --shadow-sm:  0 1px 3px rgba(0,0,0,0.5);
  --shadow-md:  0 4px 16px rgba(0,0,0,0.6), 0 1px 4px rgba(0,0,0,0.4);
  --shadow-lg:  0 8px 40px rgba(0,0,0,0.7), 0 2px 8px rgba(0,0,0,0.5);
  --shadow-xl:  0 20px 60px rgba(0,0,0,0.8);

  --glow-accent: 0 0 20px rgba(63,185,80,0.3);
  --glow-info:   0 0 20px rgba(88,166,255,0.3);
}

/* ── Reset & Base ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--fg);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
input, textarea { font-family: inherit; }

/* ── Scrollbar ─────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(63,185,80,0.4); }

/* ── Grid Background ───────────────────────────────────────────── */
.gg-grid-bg {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(48,54,61,0.3) 1px, transparent 1px),
    linear-gradient(90deg, rgba(48,54,61,0.3) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}
.gg-grid-bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(63,185,80,0.06) 0%, transparent 70%);
}

/* ── Brand ─────────────────────────────────────────────────────── */
.gg-brand-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #3fb950, #58a6ff);
  border-radius: 8px;
  color: var(--bg);
  box-shadow: var(--glow-accent);
  flex-shrink: 0;
}
.gg-brand { display: flex; align-items: center; gap: 10px; }
.gg-brand-name {
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 600;
  color: var(--fg);
  letter-spacing: -0.03em;
}
.gg-brand-name .ver {
  color: var(--fg-4);
  font-weight: 400;
  font-size: 11px;
}

/* ── Navigation ────────────────────────────────────────────────── */
.gg-nav {
  position: relative;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  height: 60px;
  border-bottom: 1px solid var(--line);
  background: rgba(13,17,23,0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.gg-nav-right {
  display: flex;
  align-items: center;
  gap: 6px;
}
.gg-nav-right a {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--fg-3);
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  transition: color 0.15s, background 0.15s;
}
.gg-nav-right a:hover { color: var(--fg); background: rgba(255,255,255,0.04); }

/* ── Kbd ───────────────────────────────────────────────────────── */
.gg-kbd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 2px 6px;
  background: var(--bg-2);
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--fg-3);
  line-height: 1.4;
  box-shadow: 0 1px 0 var(--bg-4);
}

/* ── Cursor blink ──────────────────────────────────────────────── */
.gg-cursor {
  display: inline-block;
  width: 2px;
  height: 1.1em;
  background: var(--accent);
  border-radius: 1px;
  vertical-align: middle;
  margin-left: 2px;
  animation: blink 1.1s step-end infinite;
  box-shadow: 0 0 8px var(--accent);
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

/* ── Eyebrow ───────────────────────────────────────────────────── */
.gg-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--fg-3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* ── Buttons ───────────────────────────────────────────────────── */
.gg-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  line-height: 1;
}
.gg-btn:disabled { opacity: 0.45; pointer-events: none; }

.gg-btn-primary {
  background: var(--accent);
  color: #0d1117;
  border-color: var(--accent);
  box-shadow: 0 0 16px rgba(63,185,80,0.25);
  font-weight: 600;
}
.gg-btn-primary:hover {
  background: #4ac959;
  box-shadow: 0 0 24px rgba(63,185,80,0.4);
  transform: translateY(-1px);
}

.gg-btn-secondary {
  background: rgba(255,255,255,0.05);
  color: var(--fg-2);
  border-color: var(--line-strong);
}
.gg-btn-secondary:hover {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.2);
  color: var(--fg);
}

.gg-btn-ghost {
  background: transparent;
  color: var(--fg-3);
  border-color: transparent;
}
.gg-btn-ghost:hover {
  background: rgba(255,255,255,0.04);
  color: var(--fg-2);
  border-color: var(--line);
}

.gg-btn-sm { padding: 5px 11px; font-size: 12px; }
.gg-btn-danger {
  background: rgba(248,81,73,0.1);
  color: #f85149;
  border-color: rgba(248,81,73,0.3);
}
.gg-btn-danger:hover {
  background: rgba(248,81,73,0.18);
  box-shadow: 0 0 16px rgba(248,81,73,0.2);
}

/* ── Cards ─────────────────────────────────────────────────────── */
.gg-card {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.gg-card:hover { border-color: rgba(255,255,255,0.12); box-shadow: var(--shadow-md); }

/* ── Inputs ────────────────────────────────────────────────────── */
.gg-input {
  width: 100%;
  padding: 9px 12px;
  background: var(--bg-2);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.gg-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(63,185,80,0.1);
}
.gg-input::placeholder { color: var(--fg-4); }

/* ── Label ─────────────────────────────────────────────────────── */
.gg-label {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--fg-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}

/* ── Avatar ────────────────────────────────────────────────────── */
.gg-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, #3fb950, #58a6ff);
  color: var(--bg);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* ── Scrollable ────────────────────────────────────────────────── */
.gg-scroll { scrollbar-width: thin; scrollbar-color: var(--bg-4) transparent; }

/* ── Code block ────────────────────────────────────────────────── */
.gg-code {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-md);
}
.gg-code-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-3);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--fg-3);
}
.gg-code-dots { display: flex; gap: 6px; }
.gg-code-dots span {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--bg-4);
}
.gg-code-dots span:nth-child(1) { background: #f85149; }
.gg-code-dots span:nth-child(2) { background: #d29922; }
.gg-code-dots span:nth-child(3) { background: #3fb950; }
.gg-code-body {
  padding: 20px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.75;
  color: var(--fg-2);
  overflow-x: auto;
}
.tok-kw  { color: #ff7b72; }
.tok-fn  { color: #d2a8ff; }
.tok-str { color: #a5d6ff; }
.tok-num { color: #79c0ff; }
.tok-var { color: var(--fg-2); }
.tok-com { color: var(--fg-4); font-style: italic; }

/* ── Sections ──────────────────────────────────────────────────── */
.gg-section { padding: 80px 0; position: relative; z-index: 1; }
.gg-container { max-width: 1200px; margin: 0 auto; padding: 0 28px; }

/* ── Divider ───────────────────────────────────────────────────── */
.gg-divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--line), transparent);
  margin: 0;
}

/* ── Badge / pill ──────────────────────────────────────────────── */
.gg-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 11px;
}
.gg-badge-accent {
  background: rgba(63,185,80,0.1);
  border: 1px solid rgba(63,185,80,0.25);
  color: var(--accent);
}

/* ── Page transitions ──────────────────────────────────────────── */
.gg-page { animation: fadeIn 0.22s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ── Landing-specific hero gradient ───────────────────────────── */
.hero-glow {
  position: absolute;
  width: 900px;
  height: 900px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(63,185,80,0.07) 0%, transparent 70%);
  top: -300px;
  left: 50%;
  transform: translateX(-50%);
  pointer-events: none;
}

/* ── Stat strip ────────────────────────────────────────────────── */
.stat-strip {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: rgba(255,255,255,0.015);
  position: relative;
  z-index: 1;
}
.stat-cell {
  padding: 28px 32px;
  border-left: 1px solid var(--line);
}
.stat-cell:first-child { border-left: none; }

/* ── Feature grid ──────────────────────────────────────────────── */
.feature-grid {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 16px;
}
@media (max-width: 1100px) { .feature-grid { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 640px)  { .feature-grid { grid-template-columns: 1fr; } }

/* ── Footer ────────────────────────────────────────────────────── */
.gg-footer {
  border-top: 1px solid var(--line);
  padding: 24px 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--fg-4);
  position: relative;
  z-index: 1;
}

/* ── Repo list ─────────────────────────────────────────────────── */
.repo-list-header {
  display: grid;
  grid-template-columns: 20px 1.4fr 2fr 110px 100px 70px 90px;
  gap: 14px;
  padding: 8px 16px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--fg-4);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  border-bottom: 1px solid var(--line);
  margin-bottom: 4px;
}

/* ── Source tiles ──────────────────────────────────────────────── */
.source-list { display: flex; flex-direction: column; gap: 6px; }

/* ── Connection string ─────────────────────────────────────────── */
.conn-string {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--fg-3);
  display: flex;
  align-items: center;
  gap: 8px;
  overflow: hidden;
}
</style>
</head>
<body>
<div id="root"></div>

<!-- Load shared brand components first -->
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="landing.jsx"></script>
<script type="text/babel" src="repo.jsx"></script>
<script type="text/babel" src="db.jsx"></script>

<!-- Router shell -->
<script type="text/babel">
const { useState } = React;

function App() {
  const [screen, setScreen] = useState('landing');

  const navigate = (to) => setScreen(to);

  return (
    <div className="gg-page" key={screen}>
      {screen === 'landing' && <Landing onNavigate={navigate} />}
      {screen === 'repo'    && <RepoSelector onNavigate={navigate} />}
      {screen === 'db'      && <DBVisualizer onNavigate={navigate} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
