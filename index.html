  <style>
/* GitGraph — Terminal-inspired dark devtool */

:root {
  --bg: #07090c;
  --bg-1: #0b0e13;
  --bg-2: #10141b;
  --bg-3: #161b24;
  --panel: #0d1117;
  --line: rgba(255, 255, 255, 0.06);
  --line-strong: rgba(255, 255, 255, 0.12);
  --fg: #e6edf3;
  --fg-2: #b1bac4;
  --fg-3: #7d8590;
  --fg-4: #4b5563;
  --accent: #3fb950;
  --accent-2: #2ea043;
  --accent-glow: rgba(63, 185, 80, 0.16);
  --info: #58a6ff;
  --warn: #d29922;
  --danger: #f85149;
  --magenta: #bc8cff;
  --cyan: #76e4f7;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-feature-settings: "ss01", "cv11";
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  overflow-x: hidden;
}

.gg-grid-bg {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(circle at 50% 0%, rgba(63,185,80,0.08), transparent 60%),
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: auto, 48px 48px, 48px 48px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 50%, transparent 100%);
}

.gg-nav {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 28px;
  border-bottom: 1px solid var(--line);
  background: rgba(7, 9, 12, 0.72);
  backdrop-filter: blur(12px) saturate(140%);
  -webkit-backdrop-filter: blur(12px) saturate(140%);
}
.gg-brand { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.gg-brand-mark {
  width: 28px; height: 28px; border-radius: 8px;
  display: grid; place-items: center;
  background: linear-gradient(160deg, #1a2a1f, #0d1f14);
  border: 1px solid rgba(63,185,80,0.25);
  box-shadow: inset 0 0 0 1px rgba(63,185,80,0.15), 0 0 24px rgba(63,185,80,0.18);
  color: var(--accent);
}
.gg-brand-mark svg { width: 16px; height: 16px; }
.gg-brand-name { color: var(--fg); }
.gg-brand-name .ver { color: var(--fg-3); font-size: 11px; }
.gg-nav-right { display: flex; align-items: center; gap: 22px; font-size: 13px; color: var(--fg-2); }
.gg-nav-right a { color: var(--fg-2); text-decoration: none; transition: color .15s; }
.gg-nav-right a:hover { color: var(--fg); }

.gg-btn {
  display: inline-flex; align-items: center; gap: 8px;
  height: 36px; padding: 0 14px;
  border-radius: 8px; border: 1px solid transparent;
  font-family: var(--sans); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all .15s ease;
  text-decoration: none; white-space: nowrap;
}
.gg-btn-primary { background: var(--accent); color: #06200d; border-color: rgba(255,255,255,0.1); box-shadow: 0 1px 0 rgba(255,255,255,0.2) inset, 0 0 0 1px rgba(63,185,80,0.4), 0 8px 24px rgba(63,185,80,0.25); }
.gg-btn-primary:hover { background: #4ec964; transform: translateY(-1px); }
.gg-btn-secondary { background: rgba(255,255,255,0.04); color: var(--fg); border-color: var(--line-strong); }
.gg-btn-secondary:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }
.gg-btn-ghost { background: transparent; color: var(--fg-2); border-color: transparent; }
.gg-btn-ghost:hover { color: var(--fg); background: rgba(255,255,255,0.04); }
.gg-btn-sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 6px; }

.gg-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-family: var(--mono); font-size: 11px; background: rgba(63,185,80,0.08); border: 1px solid rgba(63,185,80,0.2); color: var(--accent); }

.gg-code { font-family: var(--mono); font-size: 13px; line-height: 1.7; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.gg-code-hd { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,0.02); font-size: 11px; color: var(--fg-3); }
.gg-code-dots { display: flex; gap: 6px; }
.gg-code-dots span { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.12); }
.gg-code-body { padding: 14px 18px; color: var(--fg-2); white-space: pre; overflow-x: auto; }

.tok-kw { color: #ff7b72; }
.tok-fn { color: #d2a8ff; }
.tok-str { color: #a5d6ff; }
.tok-num { color: #79c0ff; }
.tok-com { color: #6e7681; font-style: italic; }
.tok-var { color: #ffa657; }
.tok-op  { color: #ff7b72; }

.gg-input { width: 100%; height: 38px; padding: 0 14px; background: var(--bg-1); border: 1px solid var(--line-strong); border-radius: 8px; color: var(--fg); font-family: var(--sans); font-size: 13px; transition: border-color .15s, background .15s, box-shadow .15s; outline: none; }
.gg-input:focus { border-color: rgba(63,185,80,0.5); box-shadow: 0 0 0 3px var(--accent-glow); background: var(--bg-2); }
.gg-input::placeholder { color: var(--fg-4); }

.gg-label { display: block; font-size: 11px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 6px; font-family: var(--mono); }

.gg-section { position: relative; z-index: 1; padding: 96px 28px; }
.gg-container { max-width: 1280px; margin: 0 auto; }

.gg-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; color: var(--fg-3); letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: 999px; background: rgba(255,255,255,0.02); }

.gg-card { background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--r-lg); transition: border-color .2s, transform .2s, box-shadow .2s; }
.gg-card:hover { border-color: var(--line-strong); }

.gg-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
.gg-scroll::-webkit-scrollbar-track { background: transparent; }
.gg-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
.gg-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); background-clip: content-box; }

.gg-view-switch {
  position: fixed; left: 16px; bottom: 16px; z-index: 2147483645;
  display: flex; gap: 4px; padding: 4px;
  background: rgba(13, 17, 23, 0.85);
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  backdrop-filter: blur(12px);
  font-family: var(--mono); font-size: 11px;
}
.gg-view-switch button { appearance: none; border: 0; background: transparent; color: var(--fg-3); padding: 6px 10px; border-radius: 6px; cursor: pointer; transition: all .15s; font-family: inherit; font-size: inherit; }
.gg-view-switch button:hover { color: var(--fg); }
.gg-view-switch button.active { background: rgba(63,185,80,0.15); color: var(--accent); box-shadow: inset 0 0 0 1px rgba(63,185,80,0.3); }

@keyframes gg-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
@keyframes gg-blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
@keyframes gg-fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.gg-cursor { display: inline-block; width: 7px; height: 14px; background: var(--accent); margin-left: 2px; vertical-align: middle; animation: gg-blink 1s steps(1, end) infinite; }

.gg-kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; font-family: var(--mono); font-size: 10px; background: rgba(255,255,255,0.06); border: 1px solid var(--line-strong); border-radius: 5px; color: var(--fg-2); box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 1px 0 rgba(0,0,0,0.4); }

.gg-avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #5eb3ff, #bc8cff); display: grid; place-items: center; font-size: 11px; font-weight: 600; color: #06080d; font-family: var(--mono); border: 1px solid var(--line-strong); }

.gg-page { animation: gg-fadein 0.22s ease; }

.gg-footer { border-top: 1px solid var(--line); padding: 24px 28px; display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 11px; color: var(--fg-4); position: relative; z-index: 1; }

.gg-divider { height: 1px; background: linear-gradient(90deg, transparent, var(--line), transparent); }

.gg-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-family: var(--mono); font-size: 11px; }
.gg-badge-accent { background: rgba(63,185,80,0.1); border: 1px solid rgba(63,185,80,0.25); color: var(--accent); }

.hero-glow { position: absolute; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(63,185,80,0.07) 0%, transparent 70%); top: -300px; left: 50%; transform: translateX(-50%); pointer-events: none; }

.stat-strip { display: grid; grid-template-columns: repeat(4,1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: rgba(255,255,255,0.015); position: relative; z-index: 1; }
.stat-cell { padding: 28px 32px; border-left: 1px solid var(--line); }
.stat-cell:first-child { border-left: none; }

.feature-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; }
@media (max-width: 1100px) { .feature-grid { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 640px)  { .feature-grid { grid-template-columns: 1fr; } }

.conn-string { background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 14px; font-family: var(--mono); font-size: 12px; color: var(--fg-3); display: flex; align-items: center; gap: 8px; overflow: hidden; }
  </style>

// ─── tweaks-panel.jsx ────────────────────────────────────────────────────────
const { useState, useEffect, useRef, useMemo } = React;

function useTweaks(defaults) {
  const key = '__gg_tweaks__';
  const stored = (() => { try { return JSON.parse(localStorage.getItem(key)) || {}; } catch { return {}; } })();
  const [t, setT] = useState({ ...defaults, ...stored });
  const setTweak = (k, v) => {
    setT(prev => {
      const next = { ...prev, [k]: v };
      try { localStorage.setItem(key, JSON.stringify(next)); } catch {}
      return next;
    });
  };
  return [t, setTweak];
}

function TweakSection({ label }) {
  return (
    <div style={{ fontFamily:'var(--mono)', fontSize:9, color:'var(--fg-4)', letterSpacing:'0.1em', textTransform:'uppercase', borderTop:'1px solid var(--line)', margin:'8px 0 6px', paddingTop:10 }}>{label}</div>
  );
}
function TweakRow({ label, children }) {
  return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:8, marginBottom:8 }}>
      <span style={{ fontFamily:'var(--mono)', fontSize:11, color:'var(--fg-3)', flex:1, minWidth:0 }}>{label}</span>
      <div style={{ flexShrink:0 }}>{children}</div>
    </div>
  );
}
function TweakRadio({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <div style={{ display:'flex', gap:2, background:'var(--bg)', borderRadius:5, padding:2, border:'1px solid var(--line)' }}>
        {options.map(o => (
          <button key={o.value} onClick={() => onChange(o.value)} style={{ fontFamily:'var(--mono)', fontSize:10, padding:'3px 7px', borderRadius:4, border:0, cursor:'pointer', background: value===o.value ? 'rgba(63,185,80,0.15)' : 'transparent', color: value===o.value ? 'var(--accent)' : 'var(--fg-3)', boxShadow: value===o.value ? 'inset 0 0 0 1px rgba(63,185,80,0.3)' : 'none', transition:'all .1s' }}>{o.label}</button>
        ))}
      </div>
    </TweakRow>
  );
}
function TweakColor({ label, value, onChange }) {
  return (
    <TweakRow label={label}>
      <div style={{ display:'flex', alignItems:'center', gap:6 }}>
        <div style={{ position:'relative', width:22, height:22 }}>
          <input type="color" value={value} onChange={e => onChange(e.target.value)} style={{ position:'absolute', inset:0, width:'100%', height:'100%', opacity:0, cursor:'pointer', border:0, padding:0 }}/>
          <span style={{ display:'block', width:22, height:22, borderRadius:5, background:value, border:'1px solid rgba(255,255,255,0.15)', pointerEvents:'none' }}/>
        </div>
        <span style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--fg-3)' }}>{value}</span>
      </div>
    </TweakRow>
  );
}
function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select value={value} onChange={e => onChange(e.target.value)} style={{ fontFamily:'var(--mono)', fontSize:11, color:'var(--fg)', background:'var(--bg-2)', border:'1px solid var(--line-strong)', borderRadius:5, padding:'3px 6px', cursor:'pointer', outline:'none', maxWidth:130 }}>
        {options.map(o => <option key={o} value={o}>{o}</option>)}
      </select>
    </TweakRow>
  );
}
function TweakToggle({ label, value, onChange }) {
  return (
    <TweakRow label={label}>
      <button onClick={() => onChange(!value)} style={{ width:30, height:17, borderRadius:999, border:0, cursor:'pointer', background: value ? 'rgba(63,185,80,0.35)' : 'var(--bg-3)', boxShadow: value ? 'inset 0 0 0 1px rgba(63,185,80,0.5)' : 'inset 0 0 0 1px var(--line-strong)', position:'relative', transition:'all .15s' }}>
        <span style={{ position:'absolute', top:1.5, left: value ? 13 : 1.5, width:12, height:12, borderRadius:'50%', background: value ? 'var(--accent)' : 'var(--fg-4)', transition:'left .15s' }}/>
      </button>
    </TweakRow>
  );
}
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = useState(true);
  return (
    <div style={{ position:'fixed', right:16, top:68, zIndex:2147483646, width:240, fontFamily:'var(--mono)' }}>
      <div style={{ background:'rgba(11,14,19,0.92)', border:'1px solid var(--line-strong)', borderRadius:10, backdropFilter:'blur(16px)', overflow:'hidden' }}>
        <button onClick={() => setOpen(o => !o)} style={{ display:'flex', alignItems:'center', justifyContent:'space-between', width:'100%', padding:'9px 12px', border:0, background:'transparent', cursor:'pointer', color:'var(--fg-2)', borderBottom: open ? '1px solid var(--line)' : 'none' }}>
          <span style={{ fontSize:11, fontWeight:500, display:'flex', alignItems:'center', gap:6 }}>
            <span style={{ color:'var(--accent)' }}>◈</span>{title}
          </span>
          <span style={{ fontSize:10, color:'var(--fg-4)', transform: open ? 'rotate(180deg)' : 'none', transition:'transform .15s' }}>▾</span>
        </button>
        {open && <div style={{ padding:'10px 12px 12px' }}>{children}</div>}
      </div>
    </div>
  );
}

  return (

      <div className="gg-nav-right">

        <button className="gg-btn gg-btn-primary gg-btn-sm">

function GraphViz({ width = 540, height = 360 }) {
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setTick(t => t + 1), 80);
    return () => clearInterval(id);
  }, []);
  const nodes = [
    { id:'app',    x:270, y:50,  label:'app/',       kind:'root',   files:124 },
    { id:'api',    x:110, y:140, label:'api/',        kind:'folder', files:47 },
    { id:'web',    x:270, y:140, label:'web/',        kind:'folder', files:38 },
    { id:'db',     x:430, y:140, label:'db/',         kind:'db',     files:12 },
    { id:'auth',   x:50,  y:240, label:'auth.ts',     kind:'file' },
    { id:'router', x:170, y:240, label:'router.ts',   kind:'file' },
    { id:'page',   x:270, y:240, label:'page.tsx',    kind:'file' },

  const activeNode = pulseNodes[Math.floor(tick / 8) % pulseNodes.length];

    if (kind === 'root') return 'var(--accent)';

        <rect width={width} height={height} fill="url(#dotgrid)"/>
        {edges.map(([a,b],i) => {
          const A=nodeMap[a], B=nodeMap[b];

          return <line key={i} x1={A.x} y1={A.y} x2={B.x} y2={B.y} stroke={isActive ? 'var(--accent)' : 'rgba(255,255,255,0.12)'} strokeWidth={isActive ? 1.5 : 1} strokeDasharray={isActive ? '4 3' : 'none'} strokeDashoffset={isActive ? -tick*0.8 : 0}/>;

        <span>memory <span style={{ color:'var(--fg)' }}>42 MB</span></span>

  return <span style={{ display:'inline-block', width:10, height:10, borderRadius:'50%', background:color, boxShadow:'0 0 4px '+color+'80', marginRight:6, verticalAlign:'middle' }}/>;
}

function RepoRow({ r, active, onMouseEnter, onSelect, mode }) {
  const ref = useRef(null);
  useEffect(() => { if (active && ref.current) ref.current.scrollIntoView({ block:'nearest' }); }, [active]);

  if (mode === 'card') {
    return (
      <div ref={ref} onMouseEnter={onMouseEnter} onClick={onSelect} className="gg-card" style={{ padding:18, cursor:'default', borderColor: active ? 'rgba(63,185,80,0.4)' : 'var(--line)', background: active ? 'rgba(63,185,80,0.04)' : 'var(--bg-1)', boxShadow: active ? '0 0 0 1px rgba(63,185,80,0.4),0 0 24px rgba(63,185,80,0.08)' : 'none', transform: active ? 'translateY(-1px)' : 'none' }}>
        <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:8 }}>
          <span style={{ fontFamily:'var(--mono)', fontSize:13, fontWeight:500, color: active ? 'var(--accent)' : 'var(--info)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{r.name}</span>
          <span style={{ padding:'2px 8px', borderRadius:999, fontFamily:'var(--mono)', fontSize:10, background: r.vis==='public' ? 'rgba(63,185,80,0.08)' : 'rgba(255,255,255,0.04)', border:'1px solid '+(r.vis==='public'?'rgba(63,185,80,0.2)':'var(--line-strong)'), color: r.vis==='public' ? 'var(--accent)' : 'var(--fg-3)', flexShrink:0 }}>{r.vis}</span>
        </div>
        <p style={{ margin:'10px 0 14px', fontSize:13, color:'var(--fg-3)', lineHeight:1.5, display:'-webkit-box', WebkitLineClamp:2, WebkitBoxOrient:'vertical', overflow:'hidden', minHeight:39 }}>{r.desc}</p>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', fontFamily:'var(--mono)', fontSize:11, color:'var(--fg-3)' }}>
          <span><LangDot color={r.langColor}/>{r.lang}</span>
          <span>★ {r.stars} · {r.age}</span>
        </div>
      </div>
    );
  }
  return (
    <div ref={ref} onMouseEnter={onMouseEnter} onClick={onSelect} style={{ display:'grid', gridTemplateColumns:'20px 1.4fr 2fr 100px 100px 80px 90px', gap:14, alignItems:'center', padding:'10px 16px', borderRadius:8, cursor:'default', background: active ? 'rgba(63,185,80,0.07)' : 'transparent', boxShadow: active ? 'inset 0 0 0 1px rgba(63,185,80,0.3)' : 'none', fontFamily:'var(--mono)', fontSize:12, transition:'background 0.1s' }}>
      <span style={{ color: active ? 'var(--accent)' : 'var(--fg-4)' }}>{active ? '▸' : '○'}</span>
      <span style={{ color: active ? 'var(--accent)' : 'var(--info)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{r.name}</span>
      <span style={{ color:'var(--fg-3)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{r.desc}</span>
      <span style={{ color:'var(--fg-2)' }}><LangDot color={r.langColor}/>{r.lang}</span>
      <span style={{ color:'var(--fg-3)' }}>{r.branch}</span>
      <span style={{ color:'var(--fg-3)' }}>★ {r.stars}</span>
      <span style={{ color:'var(--fg-3)', textAlign:'right' }}>{r.age}</span>
    </div>
  );
}

          {[{h:'a8f3c2d',m:'fix: handle null branch refs',a:'2h'},{h:'4e1b09a',m:'feat: add schema diff endpoint',a:'1d'},{h:'9c2f8e1',m:'chore: bump deps to latest',a:'3d'}].map(c => (

function RepoSelector({ onNavigate }) {
  const [q, setQ] = useState('');
  const [filter, setFilter] = useState('all');
  const [lang, setLang] = useState('all');
  const [active, setActive] = useState(0);
  const [mode, setMode] = useState('list');
  const inputRef = useRef(null);

  const filtered = useMemo(() => REPOS.filter(r => {
    if (filter==='public' && r.vis!=='public') return false;
    if (filter==='private' && r.vis!=='private') return false;
    if (filter==='analyzed' && r.status!=='analyzed') return false;
    if (filter==='starred' && r.stars<50) return false;
    if (lang!=='all' && r.lang!==lang) return false;
    if (q && !(r.name.toLowerCase().includes(q.toLowerCase()) || r.desc.toLowerCase().includes(q.toLowerCase()))) return false;
    return true;
  }), [q, filter, lang]);

  useEffect(() => { setActive(0); }, [q, filter, lang]);
  useEffect(() => { inputRef.current?.focus(); }, []);

  const onKey = (e) => {
    if (e.key==='ArrowDown') { e.preventDefault(); setActive(a => Math.min(a+1, filtered.length-1)); }
    else if (e.key==='ArrowUp') { e.preventDefault(); setActive(a => Math.max(a-1, 0)); }
    else if (e.key==='Escape') setQ('');
  };

  return (
    <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column' }}>
      <div className="gg-grid-bg"/>
      <GGNav variant="app" current="select-repo"/>
      <div style={{ position:'relative', zIndex:1, flex:1, display:'grid', gridTemplateColumns:'1fr 380px', minHeight:0 }}>
        <div style={{ display:'flex', flexDirection:'column', minHeight:0, padding:'24px 28px', gap:16 }}>
          <div>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:18 }}>
              <div>
                <h1 style={{ margin:0, fontFamily:'var(--mono)', fontSize:20, fontWeight:500, letterSpacing:'-0.01em' }}>
                  <span style={{ color:'var(--fg-3)' }}>›</span> select_repository<span className="gg-cursor"/>
                </h1>
                <p style={{ margin:'6px 0 0', color:'var(--fg-3)', fontSize:13 }}>{filtered.length} of {REPOS.length} repositories · indexed via github.com/raman1530</p>
              </div>
              <div style={{ display:'flex', gap:6 }}>
                {[['list','list'],['card','cards']].map(([v,l]) => (
                  <button key={v} onClick={() => setMode(v)} className={`gg-btn gg-btn-sm ${mode===v?'gg-btn-secondary':'gg-btn-ghost'}`} style={mode===v?{color:'var(--accent)',borderColor:'rgba(63,185,80,0.3)',background:'rgba(63,185,80,0.06)'}:{}}>{l}</button>
                ))}
              </div>
            </div>
          </div>

          <div style={{ position:'relative', background:'var(--bg-1)', border:'1px solid var(--line-strong)', borderRadius:10, padding:'4px 12px', display:'flex', alignItems:'center', gap:10 }}>
            <span style={{ fontFamily:'var(--mono)', fontSize:14, color:'var(--accent)', flexShrink:0 }}>›</span>
            <input ref={inputRef} value={q} onChange={e => setQ(e.target.value)} onKeyDown={onKey} placeholder="filter repositories — type to fuzzy match name or description" style={{ flex:1, background:'transparent', border:0, outline:0, color:'var(--fg)', fontFamily:'var(--mono)', fontSize:13, padding:'10px 0' }}/>
            <div style={{ display:'flex', gap:6, alignItems:'center', color:'var(--fg-3)', fontFamily:'var(--mono)', fontSize:11 }}>
              <span className="gg-kbd">↑</span><span className="gg-kbd">↓</span><span style={{ margin:'0 4px' }}>navigate</span>
              <span className="gg-kbd">↵</span><span style={{ margin:'0 4px' }}>select</span>
              <span className="gg-kbd">esc</span><span style={{ marginLeft:4 }}>clear</span>
            </div>
          </div>

          <div style={{ display:'flex', gap:14, alignItems:'center', flexWrap:'wrap' }}>
            <div style={{ display:'flex', gap:0, padding:3, background:'var(--bg-1)', borderRadius:8, border:'1px solid var(--line)' }}>
              {FILTERS.map(f => (
                <button key={f} onClick={() => setFilter(f)} style={{ padding:'6px 12px', border:0, borderRadius:5, fontFamily:'var(--mono)', fontSize:12, cursor:'pointer', background: filter===f ? 'rgba(63,185,80,0.1)' : 'transparent', color: filter===f ? 'var(--accent)' : 'var(--fg-3)', boxShadow: filter===f ? 'inset 0 0 0 1px rgba(63,185,80,0.25)' : 'none', transition:'all 0.1s' }}>{f}</button>
              ))}
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:8, fontFamily:'var(--mono)', fontSize:12, color:'var(--fg-3)' }}>
              <span>lang:</span>
              <div style={{ display:'flex', gap:4, flexWrap:'wrap' }}>
                {LANGS.map(l => (
                  <button key={l} onClick={() => setLang(l)} style={{ padding:'4px 10px', border:'1px solid', borderColor: lang===l ? 'rgba(63,185,80,0.3)' : 'var(--line)', borderRadius:5, fontFamily:'var(--mono)', fontSize:11, cursor:'pointer', background: lang===l ? 'rgba(63,185,80,0.06)' : 'transparent', color: lang===l ? 'var(--accent)' : 'var(--fg-3)' }}>{l}</button>
                ))}
              </div>
            </div>
          </div>

          <div className="gg-scroll" style={{ flex:1, overflow:'auto', minHeight:0, paddingRight:6 }}>
            {filtered.length===0 ? (
              <div style={{ padding:'80px 0', textAlign:'center', fontFamily:'var(--mono)', color:'var(--fg-3)' }}>
                <div style={{ fontSize:24, marginBottom:12 }}>(╯°□°)╯</div>
                <div style={{ fontSize:13 }}>no repos match "<span style={{ color:'var(--fg)' }}>{q}</span>"</div>
              </div>
            ) : mode==='card' ? (
              <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))', gap:14 }}>
                {filtered.map((r,i) => <RepoRow key={r.name} r={r} active={i===active} mode="card" onMouseEnter={() => setActive(i)} onSelect={() => setActive(i)}/>)}
              </div>
            ) : (
              <div style={{ display:'flex', flexDirection:'column' }}>
                <div style={{ display:'grid', gridTemplateColumns:'20px 1.4fr 2fr 100px 100px 80px 90px', gap:14, padding:'8px 16px', fontFamily:'var(--mono)', fontSize:10, color:'var(--fg-4)', textTransform:'uppercase', letterSpacing:'0.06em', borderBottom:'1px solid var(--line)', marginBottom:4 }}>
                  <span/><span>name</span><span>description</span><span>language</span><span>branch</span><span>★</span><span style={{ textAlign:'right' }}>updated</span>
                </div>
                {filtered.map((r,i) => <RepoRow key={r.name} r={r} active={i===active} mode="list" onMouseEnter={() => setActive(i)} onSelect={() => setActive(i)}/>)}
              </div>
            )}
          </div>

          <div style={{ display:'flex', justifyContent:'space-between', paddingTop:12, borderTop:'1px solid var(--line)', fontFamily:'var(--mono)', fontSize:11, color:'var(--fg-3)' }}>
            <span>showing <span style={{ color:'var(--fg)' }}>{filtered.length}</span> · <span style={{ color:'var(--accent)' }}>{filtered.filter(r=>r.status==='analyzed').length}</span> analyzed</span>
            <span>connected as <span style={{ color:'var(--fg)' }}>raman1530</span> · scope: repo,read:org</span>
          </div>
        </div>

        <div style={{ borderLeft:'1px solid var(--line)', background:'rgba(255,255,255,0.015)', display:'flex', flexDirection:'column', overflow:'auto' }}>
          <RepoPreview r={filtered[active]}/>
        </div>
      </div>
    </div>
  );
}

                  <div><div style={{ fontSize:24, color:'var(--fg-4)', marginBottom:8 }}>⤓</div>drop <span style={{ color:'var(--fg-2)' }}>schema.sql</span> here<div style={{ fontSize:11, marginTop:6, color:'var(--fg-4)' }}>or paste DDL · max 50 MB</div></div>
                </div>
              ) : (
                <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
                  <div style={{ display:'flex', gap:14 }}>
                    <div style={{ flex:1 }}>
                      <label className="gg-label">host</label>
                      <input className="gg-input" value={host} onChange={e => setHost(e.target.value)} style={{ fontFamily:'var(--mono)' }}/>
                    </div>
                    <div>
                      <label className="gg-label">port</label>
                      <input className="gg-input" value={port} onChange={e => setPort(e.target.value)} style={{ fontFamily:'var(--mono)', maxWidth:120 }}/>
                    </div>

                  <div><label className="gg-label">database</label><input className="gg-input" value={dbname} onChange={e => setDbname(e.target.value)} style={{ fontFamily:'var(--mono)' }}/></div>
                  <div style={{ display:'flex', gap:14 }}>
                    <div style={{ flex:1 }}><label className="gg-label">username</label><input className="gg-input" value={user} onChange={e => setUser(e.target.value)} style={{ fontFamily:'var(--mono)' }}/></div>
                    <div style={{ flex:1 }}><label className="gg-label">password</label><input className="gg-input" type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="••••••••" style={{ fontFamily:'var(--mono)' }}/></div>
                  </div>

                    <Toggle label="require SSL" value={ssl} onChange={setSsl}/>

              <div style={{ marginTop:'auto', background:'var(--panel)', border:'1px solid var(--line)', borderRadius:8, padding:'10px 14px', fontFamily:'var(--mono)', fontSize:12, color:'var(--fg-2)', display:'flex', alignItems:'center', gap:8, overflow:'hidden' }}>

                  <span style={{ color:'var(--fg-3)' }}>@</span>
                  <span style={{ color:'var(--accent)' }}>{host}:{port}</span>
                  <span style={{ color:'var(--fg-3)' }}>/</span>
                  <span style={{ color:'var(--fg)' }}>{dbname}</span>

              </div>

              <div style={{ display:'flex', gap:10, alignItems:'center' }}>
                <button className="gg-btn gg-btn-primary" style={{ flex:1, justifyContent:'center' }}>
                  <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="m11.78 8.78-7 7a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734L9.69 8.75H1.75a.75.75 0 0 1 0-1.5h7.94L3.72 1.28A.749.749 0 0 1 4.78.22l7 7a.749.749 0 0 1 0 1.06Z"/></svg>
                  connect &amp; analyze
                  <span className="gg-kbd" style={{ background:'rgba(0,0,0,0.2)', borderColor:'rgba(0,0,0,0.3)', color:'rgba(6,32,13,0.7)', marginLeft:6 }}>↵</span>
                </button>

              </div>

                <div style={{ background:'var(--panel)', border:'1px solid var(--line)', borderRadius:8, overflow:'hidden' }}><MiniSchemaPreview/></div>
                <div style={{ fontFamily:'var(--mono)', fontSize:11, color:'var(--fg-3)', marginTop:8, textAlign:'center' }}>preview after connect · 47 tables · 132 fkeys</div>
              </div>
              <div>
                <div className="gg-label" style={{ marginBottom:10 }}>what we read</div>
                <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                  {[['table & column metadata',true],['foreign keys & indexes',true],['view definitions',true],['row data / values',false],['stored procedures',true]].map(([label,yes]) => (
                    <div key={label} style={{ display:'flex', alignItems:'center', gap:10, fontFamily:'var(--mono)', fontSize:12, color: yes ? 'var(--fg-2)' : 'var(--fg-4)' }}>
                      <span style={{ width:14, height:14, borderRadius:3, display:'grid', placeItems:'center', background: yes ? 'rgba(63,185,80,0.12)' : 'rgba(248,81,73,0.08)', color: yes ? 'var(--accent)' : 'var(--danger)', fontSize:9 }}>{yes?'✓':'✕'}</span>
                      <span style={{ textDecoration: yes ? 'none' : 'line-through' }}>{label}</span>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{ marginTop:'auto', padding:'12px 14px', background:'rgba(88,166,255,0.06)', border:'1px solid rgba(88,166,255,0.18)', borderRadius:8, fontSize:11.5, lineHeight:1.5, color:'var(--fg-2)' }}>
                <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:6, color:'var(--info)', fontFamily:'var(--mono)', fontSize:11 }}><span>ⓘ</span> safe by default</div>
                Connection runs in your browser via WebSocket tunnel. Credentials are encrypted with your local key — never touch our servers.
              </div>
            </div>
          </div>

          <div style={{ marginTop:18, display:'flex', justifyContent:'center', gap:24, fontFamily:'var(--mono)', fontSize:11, color:'var(--fg-3)' }}>
            <span><span className="gg-kbd">tab</span> next field</span>
            <span><span className="gg-kbd">⌘</span><span className="gg-kbd">↵</span> connect</span>
            <span><span className="gg-kbd">esc</span> back</span>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── explorer.jsx ─────────────────────────────────────────────────────────────
const TREE = [
  { id:'src',           parent:null,       kind:'dir', name:'src/',         files:124 },
  { id:'src/api',       parent:'src',      kind:'dir', name:'api/',         files:47  },
  { id:'src/web',       parent:'src',      kind:'dir', name:'web/',         files:38  },
  { id:'src/db',        parent:'src',      kind:'dir', name:'db/',          files:12  },
  { id:'src/shared',    parent:'src',      kind:'dir', name:'shared/',      files:27  },
  { id:'auth.ts',       parent:'src/api',  kind:'ts',  name:'auth.ts',      lines:312, deps:4, exports:6 },
  { id:'router.ts',     parent:'src/api',  kind:'ts',  name:'router.ts',    lines:198, deps:3, exports:2 },
  { id:'middleware.ts', parent:'src/api',  kind:'ts',  name:'middleware.ts',lines:87,  deps:2, exports:3 },
  { id:'page.tsx',      parent:'src/web',  kind:'tsx', name:'page.tsx',     lines:445, deps:8, exports:1 },
  { id:'Card.tsx',      parent:'src/web',  kind:'tsx', name:'Card.tsx',     lines:122, deps:2, exports:1 },
  { id:'Layout.tsx',    parent:'src/web',  kind:'tsx', name:'Layout.tsx',   lines:89,  deps:3, exports:1 },
  { id:'schema.sql',    parent:'src/db',   kind:'sql', name:'schema.sql',   lines:234, deps:0, exports:0 },
  { id:'migrate.ts',    parent:'src/db',   kind:'ts',  name:'migrate.ts',   lines:156, deps:2, exports:1 },
  { id:'types.ts',      parent:'src/shared',kind:'ts', name:'types.ts',     lines:78,  deps:0, exports:14 },
  { id:'utils.ts',      parent:'src/shared',kind:'ts', name:'utils.ts',     lines:203, deps:1, exports:9  },
];
const KIND_COLOR = { dir:'var(--magenta)', ts:'var(--info)', tsx:'var(--accent)', sql:'var(--cyan)', default:'var(--fg-3)' };

function Explorer({ onNavigate }) {
  const [expanded, setExpanded] = useState({ src:true, 'src/api':true, 'src/web':false, 'src/db':false, 'src/shared':false });
  const [selected, setSelected] = useState(null);
  const [q, setQ] = useState('');
  const childrenOf = (id) => TREE.filter(n => n.parent === id);
  const toggleExpand = (id) => setExpanded(e => ({ ...e, [id]: !e[id] }));
  const filtered = useMemo(() => q ? TREE.filter(n => n.kind !== 'dir' && n.name.toLowerCase().includes(q.toLowerCase())) : null, [q]);

  function renderTree(nodes, depth = 0) {
    return nodes.map(node => {
      const isDir = node.kind === 'dir';
      const color = KIND_COLOR[node.kind] || KIND_COLOR.default;
      const isSelected = selected?.id === node.id;
      return (
        <React.Fragment key={node.id}>
          <div onClick={() => isDir ? toggleExpand(node.id) : setSelected(node)} style={{ display:'flex', alignItems:'center', gap:6, padding:'5px 8px', paddingLeft:8+depth*14, borderRadius:5, cursor:'pointer', background: isSelected ? 'rgba(63,185,80,0.08)' : 'transparent', boxShadow: isSelected ? 'inset 0 0 0 1px rgba(63,185,80,0.25)' : 'none', fontFamily:'var(--mono)', fontSize:12, color: isSelected ? 'var(--accent)' : 'var(--fg-2)', transition:'background .1s' }}>
            {isDir ? <span style={{ width:10, color:'var(--fg-4)', fontSize:9 }}>{expanded[node.id]?'▾':'▸'}</span> : <span style={{ width:10 }}/>}
            <span style={{ color, display:'flex', alignItems:'center', fontSize:10 }}>{isDir?'📁':'📄'}</span>
            <span style={{ flex:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{node.name}</span>
            {isDir && <span style={{ color:'var(--fg-4)', fontSize:10 }}>{node.files}</span>}
          </div>
          {isDir && expanded[node.id] && renderTree(childrenOf(node.id), depth+1)}
        </React.Fragment>
      );
    });
  }

  return (
    <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column' }}>
      <div className="gg-grid-bg"/>
      <GGNav variant="app" current="explorer"/>
      <div style={{ position:'relative', zIndex:1, flex:1, display:'grid', gridTemplateColumns:'280px 1fr', minHeight:0 }}>
        <div style={{ borderRight:'1px solid var(--line)', background:'rgba(0,0,0,0.15)', display:'flex', flexDirection:'column', minHeight:0 }}>
          <div style={{ padding:'14px 12px', borderBottom:'1px solid var(--line)' }}>
            <div style={{ display:'flex', alignItems:'center', gap:8, background:'var(--bg-1)', border:'1px solid var(--line-strong)', borderRadius:7, padding:'7px 10px' }}>
              <svg width="12" height="12" viewBox="0 0 16 16" fill="var(--fg-4)"><path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"/></svg>
              <input value={q} onChange={e => setQ(e.target.value)} placeholder="search files…" style={{ flex:1, background:'transparent', border:0, outline:0, fontFamily:'var(--mono)', fontSize:12, color:'var(--fg)' }}/>
            </div>
          </div>
          <div className="gg-scroll" style={{ flex:1, overflow:'auto', padding:'8px' }}>
            {filtered
              ? filtered.length===0
                ? <div style={{ textAlign:'center', padding:'40px 0', fontFamily:'var(--mono)', fontSize:12, color:'var(--fg-4)' }}>no matches</div>
                : filtered.map(node => {
                    const isSelected = selected?.id === node.id;
                    return <div key={node.id} onClick={() => setSelected(node)} style={{ display:'flex', alignItems:'center', gap:6, padding:'5px 8px', borderRadius:5, cursor:'pointer', background: isSelected ? 'rgba(63,185,80,0.08)' : 'transparent', fontFamily:'var(--mono)', fontSize:12, color: isSelected ? 'var(--accent)' : 'var(--fg-2)' }}><span style={{ fontSize:10 }}>📄</span>{node.name}</div>;
                  })
              : renderTree(TREE.filter(n => n.parent === null))}
          </div>
          <div style={{ padding:'8px 12px', borderTop:'1px solid var(--line)', fontFamily:'var(--mono)', fontSize:10, color:'var(--fg-4)', display:'flex', justifyContent:'space-between' }}>
            <span>{TREE.filter(n=>n.kind!=='dir').length} files</span>
            <span>gitgraph/src</span>
          </div>
        </div>

        <div style={{ display:'flex', flexDirection:'column', overflow:'hidden', background:'rgba(255,255,255,0.008)' }}>
          <div style={{ padding:'12px 28px', borderBottom:'1px solid var(--line)', fontFamily:'var(--mono)', fontSize:12, color:'var(--fg-3)', display:'flex', alignItems:'center', gap:8 }}>
            <span style={{ cursor:'pointer', color:'var(--fg-2)' }} onClick={() => onNavigate?.('repo')}>← workspace</span>
            <span style={{ opacity:0.5 }}>›</span><span>explorer</span>
            {selected && <><span style={{ opacity:0.5 }}>›</span><span style={{ color:'var(--fg)' }}>{selected.name}</span></>}
          </div>
          {!selected ? (
            <div style={{ flex:1, display:'grid', placeItems:'center', color:'var(--fg-4)', fontFamily:'var(--mono)', fontSize:13 }}>
              <div style={{ textAlign:'center', lineHeight:1.8 }}><div style={{ fontSize:24, marginBottom:8 }}>∅</div>select a file to inspect</div>
            </div>
          ) : (
            <div style={{ flex:1, overflow:'auto', padding:'24px 28px', display:'flex', flexDirection:'column', gap:24 }}>
              <div style={{ display:'flex', alignItems:'center', gap:12 }}>
                <span style={{ width:40, height:40, borderRadius:8, display:'grid', placeItems:'center', background:(KIND_COLOR[selected.kind]||'var(--fg-3)')+'18', color:KIND_COLOR[selected.kind]||'var(--fg-3)', border:'1px solid '+(KIND_COLOR[selected.kind]||'var(--fg-3)')+'44', fontSize:18 }}>📄</span>
                <div>
                  <div style={{ fontFamily:'var(--mono)', fontSize:16, fontWeight:500, color:'var(--fg)' }}>{selected.name}</div>
                  <div style={{ fontFamily:'var(--mono)', fontSize:11, color:'var(--fg-3)', marginTop:3 }}>{selected.parent} · last modified 2h ago</div>
                </div>
              </div>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:1, background:'var(--line)', borderRadius:8, overflow:'hidden', border:'1px solid var(--line)' }}>
                {[['lines',selected.lines],['deps in',selected.deps],['exports',selected.exports],['kind','.'+selected.kind]].map(([k,v]) => (
                  <div key={k} style={{ padding:'12px 14px', background:'var(--bg-1)', display:'flex', flexDirection:'column', gap:3 }}>
                    <span style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--fg-3)', textTransform:'uppercase', letterSpacing:'0.06em' }}>{k}</span>
                    <span style={{ fontFamily:'var(--mono)', fontSize:16, fontWeight:600, color:'var(--fg)' }}>{v}</span>
                  </div>
                ))}
              </div>
              <div style={{ marginTop:'auto', padding:'10px 14px', borderRadius:8, fontSize:12, lineHeight:1.5, background: selected.lines>300 ? 'rgba(248,81,73,0.06)' : 'rgba(63,185,80,0.06)', border:'1px solid '+(selected.lines>300?'rgba(248,81,73,0.2)':'rgba(63,185,80,0.15)'), color: selected.lines>300 ? 'var(--danger)' : 'var(--accent)', fontFamily:'var(--mono)' }}>
                {selected.lines>300 ? `⚠ Large file (${selected.lines} lines) — consider splitting` : `✓ Healthy — ${selected.lines} lines, well scoped`}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = {
  screen:     'landing',
  accent:     '#3fb950',
  monoFont:   'JetBrains Mono',
  showGridBg: true,
};

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = useState(t.screen || 'landing');

  useEffect(() => {
    document.documentElement.style.setProperty('--accent', t.accent);
    document.documentElement.style.setProperty('--accent-glow', t.accent + '28');
  }, [t.accent]);

  useEffect(() => {
    if (t.screen && t.screen !== screen) setScreen(t.screen);
  }, [t.screen]);

  const navigate = (s) => { setScreen(s); setTweak('screen', s); };

  return (
    <>
      {screen === 'landing'  && <Landing      onNavigate={navigate}/>}
      {screen === 'repo'     && <RepoSelector onNavigate={navigate}/>}
      {screen === 'db'       && <DBVisualizer  onNavigate={navigate}/>}
      {screen === 'explorer' && <Explorer      onNavigate={navigate}/>}

      <div className="gg-view-switch">
        <button className={screen==='landing'  ? 'active' : ''} onClick={() => navigate('landing')}>01 landing</button>
        <button className={screen==='repo'     ? 'active' : ''} onClick={() => navigate('repo')}>02 repo selector</button>
        <button className={screen==='db'       ? 'active' : ''} onClick={() => navigate('db')}>03 db visualizer</button>
        <button className={screen==='explorer' ? 'active' : ''} onClick={() => navigate('explorer')}>04 explorer</button>
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="View"/>
        <TweakRadio label="Screen" value={screen}
          options={[{value:'landing',label:'01'},{value:'repo',label:'02'},{value:'db',label:'03'},{value:'explorer',label:'04'}]}
          onChange={navigate}/>
        <TweakSection label="Brand"/>
        <TweakColor label="Accent" value={t.accent} onChange={(v) => setTweak('accent', v)}/>
        <TweakSelect label="Mono font" value={t.monoFont}
          options={['JetBrains Mono','IBM Plex Mono','Fira Code','Geist Mono']}
          onChange={(v) => {
            setTweak('monoFont', v);
            document.documentElement.style.setProperty('--mono', `'${v}', ui-monospace, monospace`);
            if (!document.querySelector(`link[data-font="${v}"]`)) {
              const link = document.createElement('link');
              link.rel = 'stylesheet'; link.dataset.font = v;
              link.href = `https://fonts.googleapis.com/css2?family=${v.replace(/ /g,'+')}:wght@400;500;600&display=swap`;
              document.head.appendChild(link);
            }
          }}/>
        <TweakSection label="Surface"/>
        <TweakToggle label="Grid background" value={t.showGridBg}
          onChange={(v) => {
            setTweak('showGridBg', v);
            document.querySelectorAll('.gg-grid-bg').forEach(el => el.style.display = v ? '' : 'none');
          }}/>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
