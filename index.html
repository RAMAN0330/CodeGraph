function GraphViz({ width = 540, height = 360 }) {
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setTick(t => t + 1), 80);
    return () => clearInterval(id);
  }, []);

  const nodes = [
    { id: 'app',     x: 270, y:  50, label: 'app/',         kind: 'root',   files: 124 },
    { id: 'api',     x: 110, y: 140, label: 'api/',         kind: 'folder', files: 47  },
    { id: 'web',     x: 270, y: 140, label: 'web/',         kind: 'folder', files: 38  },
    { id: 'db',      x: 430, y: 140, label: 'db/',          kind: 'db',     files: 12  },
    { id: 'auth',    x:  50, y: 240, label: 'auth.ts',      kind: 'file' },
    { id: 'router',  x: 170, y: 240, label: 'router.ts',    kind: 'file' },
    { id: 'page',    x: 270, y: 240, label: 'page.tsx',     kind: 'file' },
    { id: 'comp',    x: 350, y: 300, label: 'Card.tsx',     kind: 'file' },
    { id: 'schema',  x: 430, y: 240, label: 'schema.sql',   kind: 'sql' },
    { id: 'users',   x: 510, y: 300, label: 'users',        kind: 'table' },
  ];
  const edges = [
    ['app','api'], ['app','web'], ['app','db'],
    ['api','auth'], ['api','router'],
    ['web','page'], ['page','comp'],
    ['db','schema'], ['schema','users'],
    ['router','auth'], ['page','router'],
  ];
  const nodeMap = Object.fromEntries(nodes.map(n => [n.id, n]));
  const pulseNodes = ['auth', 'page', 'schema', 'comp', 'router', 'users'];
  const activeNode = pulseNodes[Math.floor(tick / 8) % pulseNodes.length];

  const colorFor = (kind) => {
    if (kind === 'root') return 'var(--accent)';
    if (kind === 'db' || kind === 'sql' || kind === 'table') return 'var(--info)';
    if (kind === 'folder') return 'var(--magenta)';
    return 'var(--fg-2)';
  };

  return (
    <div className="gg-card" style={{padding:0, overflow:'hidden', background:'linear-gradient(180deg,rgba(7,9,12,0.97),rgba(7,9,12,0.8))', backdropFilter:'blur(8px)'}}>
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', padding:'10px 14px', borderBottom:'1px solid var(--line)', fontFamily:'var(--mono)', fontSize:11, color:'var(--fg-3)'}}>
        <div style={{display:'flex', gap:6, alignItems:'center'}}>
          <span style={{width:8, height:8, borderRadius:'50%', background:'var(--accent)', boxShadow:'0 0 8px var(--accent)'}}/>
          <span style={{color:'var(--fg-2)'}}>./codeflow</span>
          <span style={{opacity:0.5}}>analyze</span>
          <span style={{color:'var(--accent)'}}>app/</span>
        </div>
        <div style={{display:'flex', gap:14}}>
          <span>nodes <span style={{color:'var(--fg)'}}>10</span></span>
          <span>edges <span style={{color:'var(--fg)'}}>11</span></span>
          <span>depth <span style={{color:'var(--fg)'}}>3</span></span>
        </div>
      </div>
      <svg viewBox={`0 0 ${width} ${height}`} width="100%" style={{display:'block'}}>
        <defs>
          <pattern id="dotgrid" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.05)"/>
          </pattern>
          <radialGradient id="nodeGlow">
            <stop offset="0%" stopColor="rgba(63,185,80,0.4)"/>
            <stop offset="100%" stopColor="rgba(63,185,80,0)"/>
          </radialGradient>
        </defs>
        <rect width={width} height={height} fill="url(#dotgrid)"/>
        {edges.map(([a,b],i) => {
          const A=nodeMap[a], B=nodeMap[b];
          const isActive = a===activeNode||b===activeNode;
          return (
            <g key={i}>
              <line x1={A.x} y1={A.y} x2={B.x} y2={B.y}
                stroke={isActive?'var(--accent)':'rgba(255,255,255,0.1)'}
                strokeWidth={isActive?1.5:1}
                strokeDasharray={isActive?'4 3':'none'}
                strokeDashoffset={isActive?-tick*0.8:0}
              />
            </g>
          );
        })}
        {nodes.map(n => {
          const isActive = n.id===activeNode;
          const c = colorFor(n.kind);
          return (
            <g key={n.id} transform={`translate(${n.x},${n.y})`}>
              {isActive && <circle r="22" fill="url(#nodeGlow)" opacity="0.8"/>}
              <circle r={n.kind==='root'?8:5} fill={isActive?c:'var(--bg)'} stroke={c} strokeWidth={n.kind==='root'?2:1.5}/>
              <text x="0" y={n.kind==='root'?-16:(n.id==='comp'||n.id==='users'?18:-10)}
                textAnchor="middle" fontFamily="var(--mono)" fontSize="10"
                fill={isActive?c:'var(--fg-3)'} style={{transition:'fill 0.2s'}}>
                {n.label}
              </text>
            </g>
          );
        })}
        <line x1={(tick*4)%width} y1="0" x2={(tick*4)%width} y2={height} stroke="rgba(63,185,80,0.12)" strokeWidth="1"/>
      </svg>
      <div style={{padding:'10px 14px', borderTop:'1px solid var(--line)', fontFamily:'var(--mono)', fontSize:11, color:'var(--fg-3)', display:'flex', justifyContent:'space-between'}}>
        <span><span style={{color:'var(--accent)'}}>●</span> indexed in <span style={{color:'var(--fg)'}}>{(0.18+(tick%30)*0.001).toFixed(3)}s</span></span>
        <span>memory <span style={{color:'var(--fg)'}}>42 MB</span></span>
      </div>
    </div>
  );
}

}

function RepoSelector({ onNavigate }) {
  const [q, setQ]         = useState('');
  const [filter, setFilter] = useState('all');
  const [lang, setLang]   = useState('all');
  const [active, setActive] = useState(0);
  const [mode, setMode]   = useState('list');
  const inputRef = useRef(null);

  const filtered = useMemo(() => REPOS.filter(r => {
    if (filter==='public'   && r.vis!=='public')   return false;
    if (filter==='private'  && r.vis!=='private')  return false;
    if (filter==='analyzed' && r.status!=='analyzed') return false;
    if (filter==='starred'  && r.stars<50)         return false;
    if (lang!=='all' && r.lang!==lang)             return false;
    if (q && !(r.name.toLowerCase().includes(q.toLowerCase())||r.desc.toLowerCase().includes(q.toLowerCase()))) return false;
    return true;
  }), [q, filter, lang]);

  useEffect(() => { setActive(0); }, [q, filter, lang]);
  useEffect(() => { inputRef.current?.focus(); }, []);

  const onKey = (e) => {
    if (e.key==='ArrowDown') { e.preventDefault(); setActive(a=>Math.min(a+1, filtered.length-1)); }
    else if (e.key==='ArrowUp') { e.preventDefault(); setActive(a=>Math.max(a-1, 0)); }
    else if (e.key==='Escape') { setQ(''); }
  };

  return (
    <div style={{minHeight:'100vh', display:'flex', flexDirection:'column', overflow:'hidden'}}>
      <div className="gg-grid-bg"/>
      <GGNav variant="app" current="select-repo"/>
      <div style={{position:'relative', zIndex:1, flex:1, display:'grid', gridTemplateColumns:'1fr 380px', minHeight:0, overflow:'hidden'}}>

              <h1 style={{margin:0, fontFamily:'var(--mono)', fontSize:20, fontWeight:600, letterSpacing:'-0.01em'}}>
                <span style={{color:'var(--fg-3)'}}>›</span> select_repository<span className="gg-cursor"/>
              </h1>
              <p style={{margin:'6px 0 0', color:'var(--fg-3)', fontSize:13}}>{filtered.length} of {REPOS.length} repositories · github.com/raman1530</p>
            </div>
            <div style={{display:'flex', gap:6}}>
              {[['list','▤'],['card','⊞']].map(([m,icon]) => (
                <button key={m} onClick={() => setMode(m)} className={`gg-btn gg-btn-sm ${mode===m?'gg-btn-secondary':'gg-btn-ghost'}`}
                  style={mode===m?{color:'var(--accent)', borderColor:'rgba(63,185,80,0.3)', background:'rgba(63,185,80,0.06)'}:{}}>{icon} {m}</button>
              ))}
            </div>
          </div>

          {/* Search */}
          <div style={{position:'relative', background:'var(--bg-1)', border:'1px solid var(--line-strong)', borderRadius:10, padding:'4px 12px', display:'flex', alignItems:'center', gap:10}}>
            <span style={{fontFamily:'var(--mono)', fontSize:14, color:'var(--accent)', flexShrink:0}}>›</span>
            <input ref={inputRef} value={q} onChange={e=>setQ(e.target.value)} onKeyDown={onKey}
              placeholder="filter — type to fuzzy match name or description"
              style={{flex:1, background:'transparent', border:0, outline:0, color:'var(--fg)', fontFamily:'var(--mono)', fontSize:13, padding:'10px 0'}}/>
            <div style={{display:'flex', gap:6, alignItems:'center', color:'var(--fg-3)', fontFamily:'var(--mono)', fontSize:11}}>
              <span className="gg-kbd">↑</span><span className="gg-kbd">↓</span>
              <span style={{margin:'0 4px'}}>navigate</span>
              <span className="gg-kbd">↵</span>
              <span style={{margin:'0 4px'}}>select</span>
            </div>
          </div>

          {/* Filters */}
          <div style={{display:'flex', gap:14, alignItems:'center', flexWrap:'wrap'}}>
            <div style={{display:'flex', gap:0, padding:3, background:'var(--bg-1)', borderRadius:8, border:'1px solid var(--line)'}}>

                <button key={f} onClick={() => setFilter(f)}

              ))}
            </div>
            <div style={{display:'flex', alignItems:'center', gap:8, fontFamily:'var(--mono)', fontSize:12, color:'var(--fg-3)'}}>
              <span>lang:</span>
              <div style={{display:'flex', gap:4, flexWrap:'wrap'}}>
                {LANGS.map(l => (
                  <button key={l} onClick={() => setLang(l)}
                    style={{padding:'4px 10px', border:'1px solid', borderColor:lang===l?'rgba(63,185,80,0.3)':'var(--line)', borderRadius:5, fontFamily:'var(--mono)', fontSize:11, cursor:'pointer', background:lang===l?'rgba(63,185,80,0.06)':'transparent', color:lang===l?'var(--accent)':'var(--fg-3)'}}>{l}</button>

const RECENT = [
  { name:'acme_prod',           kind:'postgres',  host:'db.acme.io:5432',      when:'2h', tables:47  },
  { name:'analytics_warehouse', kind:'snowflake', host:'xy12345.us-east-1',    when:'1d', tables:213 },
  { name:'mobile-app.sql',      kind:'sqldump',   host:'local file',            when:'3d', tables:12  },
];

function MiniSchemaPreview() {
  return (
    <svg viewBox="0 0 400 200" style={{width:'100%', height:'auto', display:'block'}}>
      <defs><pattern id="dotgrid2" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="0.5" cy="0.5" r="0.5" fill="rgba(255,255,255,0.05)"/></pattern></defs>
      <rect width="400" height="200" fill="url(#dotgrid2)"/>
      {[{x:30,y:40,w:100,label:'users',cols:['id','email','role'],color:'#3fb950'},{x:170,y:30,w:100,label:'posts',cols:['id','user_id','body'],color:'#58a6ff'},{x:290,y:90,w:100,label:'tags',cols:['id','name'],color:'#bc8cff'},{x:30,y:130,w:100,label:'sessions',cols:['id','user_id'],color:'#d29922'}].map((t,i) => (
        <g key={i}>
          <rect x={t.x} y={t.y} width={t.w} height={20+t.cols.length*14} rx="4" fill="rgba(13,17,23,0.95)" stroke={t.color} strokeWidth="1"/>
          <rect x={t.x} y={t.y} width={t.w} height="18" rx="4" fill={t.color} fillOpacity="0.15"/>
          <text x={t.x+8} y={t.y+13} fontFamily="var(--mono)" fontSize="9" fill={t.color}>{t.label}</text>
          {t.cols.map((c,ci) => <text key={ci} x={t.x+8} y={t.y+30+ci*14} fontFamily="var(--mono)" fontSize="9" fill="var(--fg-3)">{c}</text>)}
        </g>
      ))}
      <path d="M130 70 Q 150 50 170 50" stroke="rgba(63,185,80,0.4)" fill="none" strokeWidth="1"/>
      <path d="M270 70 Q 285 80 290 100" stroke="rgba(88,166,255,0.4)" fill="none" strokeWidth="1"/>
      <path d="M80 130 Q 80 100 80 78" stroke="rgba(210,153,34,0.4)" fill="none" strokeWidth="1"/>
    </svg>
  );
}

function Toggle({ label, value, onChange }) {
  return (
    <button onClick={() => onChange(!value)} style={{display:'inline-flex', alignItems:'center', gap:8, background:'transparent', border:0, cursor:'pointer', color:'inherit', padding:0, fontFamily:'inherit'}}>
      <span style={{width:30, height:18, borderRadius:999, background:value?'rgba(63,185,80,0.3)':'var(--bg-3)', border:'1px solid '+(value?'rgba(63,185,80,0.5)':'var(--line-strong)'), position:'relative', transition:'all 0.15s', display:'inline-block'}}>
        <span style={{position:'absolute', top:1, left:value?13:1, width:14, height:14, borderRadius:'50%', background:value?'var(--accent)':'var(--fg-3)', transition:'left 0.15s', display:'block'}}/>
      </span>
      <span style={{fontFamily:'var(--mono)', fontSize:12, color:value?'var(--fg-2)':'var(--fg-3)'}}>{label}</span>
    </button>
  );
}

function DBVisualizer({ onNavigate }) {
  const [source, setSource] = useState('postgres');
  const [host,   setHost]   = useState('db.production.acme.io');
  const [port,   setPort]   = useState('5432');
  const [dbname, setDbname] = useState('acme_prod');
  const [user,   setUser]   = useState('readonly_app');
  const [pass,   setPass]   = useState('');
  const [ssl,    setSsl]    = useState(true);
  const [ro,     setRo]     = useState(true);
  const cur = SOURCES.find(s => s.id === source);

  return (
    <div style={{minHeight:'100vh', overflowY:'auto'}}>
      <div className="gg-grid-bg"/>
      <GGNav variant="app" current="db-visualizer"/>
      <div style={{position:'relative', zIndex:1, padding:'28px 28px 60px'}}>
        <div style={{maxWidth:1200, margin:'0 auto'}}>
          <div style={{display:'flex', alignItems:'flex-end', justifyContent:'space-between', marginBottom:24, gap:24, flexWrap:'wrap'}}>
            <div>
              <div style={{display:'flex', alignItems:'center', gap:10, color:'var(--fg-3)', fontFamily:'var(--mono)', fontSize:12, marginBottom:8}}>
                <span style={{cursor:'pointer', color:'var(--fg-2)'}} onClick={() => onNavigate?.('repo')}>← workspace</span>
                <span style={{opacity:0.5}}>›</span>
                <span style={{color:'var(--fg)'}}>database_visualizer</span>
              </div>
              <h1 style={{margin:0, fontFamily:'var(--mono)', fontSize:24, fontWeight:600, letterSpacing:'-0.01em'}}>
                <span style={{color:'var(--fg-3)'}}>›</span> connect_database<span className="gg-cursor"/>
              </h1>
              <p style={{margin:'8px 0 0', color:'var(--fg-3)', fontSize:13, maxWidth:560}}>
                Pick a data source on the left, configure on the right. We pull schema, indexes, and foreign keys — never row data.
              </p>
            </div>
            <div style={{display:'flex', alignItems:'center', gap:8, fontFamily:'var(--mono)', fontSize:11, color:'var(--fg-3)'}}>
              <span style={{display:'inline-flex', width:6, height:6, borderRadius:'50%', background:'var(--accent)', boxShadow:'0 0 6px var(--accent)'}}/>
              tunnel ready · 4 connections cached
            </div>
          </div>

          <div className="gg-card" style={{padding:0, overflow:'hidden', background:'linear-gradient(180deg,rgba(255,255,255,0.015),transparent)', display:'grid', gridTemplateColumns:'300px 1fr 340px', minHeight:560}}>
            {/* Sources */}
            <div style={{padding:20, borderRight:'1px solid var(--line)', background:'rgba(0,0,0,0.15)', display:'flex', flexDirection:'column', gap:14}}>
              <div>
                <div className="gg-label">data sources</div>
                <div style={{display:'flex', flexDirection:'column', gap:5, marginTop:4}}>
                  {SOURCES.map(s => (
                    <button key={s.id} onClick={() => setSource(s.id)} style={{display:'flex', alignItems:'center', gap:10, width:'100%', padding:'10px 12px', background:source===s.id?'rgba(63,185,80,0.06)':'transparent', border:'1px solid '+(source===s.id?'rgba(63,185,80,0.35)':'var(--line)'), borderRadius:8, cursor:'pointer', textAlign:'left', color:'inherit', transition:'all 0.12s', boxShadow:source===s.id?'inset 2px 0 0 var(--accent)':'none'}}>
                      <span style={{width:30, height:30, borderRadius:6, display:'grid', placeItems:'center', flexShrink:0, background:s.color+'22', border:'1px solid '+s.color+'55', color:s.color, fontFamily:'var(--mono)', fontSize:13, fontWeight:600}}>{s.icon}</span>
                      <div style={{minWidth:0, flex:1}}>
                        <div style={{fontFamily:'var(--mono)', fontSize:12, fontWeight:500, color:source===s.id?'var(--accent)':'var(--fg)'}}>{s.label}</div>
                        <div style={{fontSize:11, color:'var(--fg-3)', marginTop:1}}>{s.sub}</div>
                      </div>
                      {source===s.id && <span style={{color:'var(--accent)', fontFamily:'var(--mono)', fontSize:13}}>›</span>}
                    </button>
                  ))}
                </div>
              </div>
              <div style={{marginTop:8}}>
                <div className="gg-label">recent</div>
                <div style={{display:'flex', flexDirection:'column', gap:5, marginTop:4}}>
                  {RECENT.map(r => (
                    <button key={r.name} style={{display:'flex', alignItems:'center', gap:10, padding:'8px 10px', borderRadius:6, background:'transparent', border:'1px solid var(--line)', cursor:'pointer', color:'inherit', textAlign:'left'}}>
                      <span style={{width:6, height:6, borderRadius:'50%', background:'var(--accent)', boxShadow:'0 0 6px var(--accent)', flexShrink:0}}/>
                      <div style={{minWidth:0, flex:1}}>
                        <div style={{fontFamily:'var(--mono)', fontSize:12, color:'var(--fg)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{r.name}</div>
                        <div style={{fontFamily:'var(--mono)', fontSize:10, color:'var(--fg-3)'}}>{r.host} · {r.tables} tables</div>
                      </div>
                      <span style={{fontFamily:'var(--mono)', fontSize:10, color:'var(--fg-4)'}}>{r.when}</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {/* Form */}
            <div style={{padding:'28px 32px', display:'flex', flexDirection:'column', gap:20}}>
              <div style={{display:'flex', alignItems:'center', gap:12}}>
                <span style={{width:42, height:42, borderRadius:8, display:'grid', placeItems:'center', background:cur.color+'22', color:cur.color, border:'1px solid '+cur.color+'55', fontFamily:'var(--mono)', fontSize:18, fontWeight:600}}>{cur.icon}</span>
                <div>
                  <h2 style={{margin:0, fontFamily:'var(--mono)', fontSize:17, fontWeight:600}}>connect to {cur.label.toLowerCase()}</h2>
                  <div style={{fontSize:12, color:'var(--fg-3)', marginTop:2}}>read-only TLS · credentials never leave your browser</div>
                </div>
              </div>

              {source==='sqldump' ? (
                <div style={{flex:1, display:'flex', flexDirection:'column', gap:14}}>
                  <div style={{height:180, border:'1.5px dashed var(--line-strong)', borderRadius:10, background:'var(--panel)', display:'grid', placeItems:'center', textAlign:'center', color:'var(--fg-3)', fontFamily:'var(--mono)', fontSize:12}}>
                    <div><div style={{fontSize:24, color:'var(--fg-4)', marginBottom:8}}>⤓</div>drop <span style={{color:'var(--fg-2)'}}>schema.sql</span> here<div style={{fontSize:11, marginTop:6, color:'var(--fg-4)'}}>or paste DDL · max 50 MB</div></div>
                  </div>
                </div>
              ) : (
                <div style={{display:'flex', flexDirection:'column', gap:14}}>
                  <div style={{display:'flex', gap:14}}>
                    <div style={{flex:1}}><div className="gg-label">host</div><input className="gg-input" value={host} onChange={e=>setHost(e.target.value)}/></div>
                    <div style={{width:100}}><div className="gg-label">port</div><input className="gg-input" value={port} onChange={e=>setPort(e.target.value)}/></div>
                  </div>
                  <div><div className="gg-label">database</div><input className="gg-input" value={dbname} onChange={e=>setDbname(e.target.value)}/></div>
                  <div style={{display:'flex', gap:14}}>
                    <div style={{flex:1}}><div className="gg-label">username</div><input className="gg-input" value={user} onChange={e=>setUser(e.target.value)}/></div>
                    <div style={{flex:1}}><div className="gg-label">password</div><input className="gg-input" type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••"/></div>
                  </div>
                  <div style={{display:'flex', gap:18, paddingTop:4}}>
                    <Toggle label="require SSL" value={ssl} onChange={setSsl}/>
                    <Toggle label="read-only mode" value={ro} onChange={setRo}/>
                  </div>
                </div>
              )}

              <div style={{marginTop:'auto', background:'var(--panel)', border:'1px solid var(--line)', borderRadius:8, padding:'10px 14px', fontFamily:'var(--mono)', fontSize:12, color:'var(--fg-2)', display:'flex', alignItems:'center', gap:8, overflow:'hidden'}}>
                <span style={{color:'var(--fg-3)', flexShrink:0}}>conn ›</span>
                <span style={{overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', flex:1}}>
                  <span style={{color:'var(--magenta)'}}>{source}{ssl&&source!=='sqldump'?'s':''}</span>
                  <span style={{color:'var(--fg-3)'}}>://</span>
                  <span style={{color:'var(--info)'}}>{user||'user'}</span>
                  <span style={{color:'var(--fg-3)'}}>:</span>
                  <span style={{color:'var(--fg-4)'}}>{pass?'••••••':'<key>'}</span>
                  <span style={{color:'var(--fg-3)'}}>@</span>
                  <span style={{color:'var(--accent)'}}>{host}:{port}</span>
                  <span style={{color:'var(--fg-3)'}}>/</span>
                  <span style={{color:'var(--fg)'}}>{dbname}</span>
                </span>
                <button style={{background:'transparent', border:0, color:'var(--fg-3)', cursor:'pointer', fontFamily:'var(--mono)', fontSize:11, padding:'4px 8px', borderRadius:4}} onClick={()=>navigator.clipboard?.writeText(`${source}${ssl?'s':''}://${user}@${host}:${port}/${dbname}`)}>copy</button>
              </div>

              <div style={{display:'flex', gap:10, alignItems:'center'}}>
                <button className="gg-btn gg-btn-primary" style={{flex:1, justifyContent:'center'}}>
                  <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="m11.78 8.78-7 7a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734L9.69 8.75H1.75a.75.75 0 0 1 0-1.5h7.94L3.72 1.28A.749.749 0 0 1 4.78.22l7 7a.749.749 0 0 1 0 1.06Z"/></svg>
                  connect &amp; analyze
                  <span className="gg-kbd" style={{background:'rgba(0,0,0,0.2)', borderColor:'rgba(0,0,0,0.3)', color:'rgba(6,32,13,0.7)', marginLeft:6}}>↵</span>
                </button>
                <button className="gg-btn gg-btn-secondary" style={{justifyContent:'center'}}>test connection</button>
              </div>
            </div>

            {/* Preview */}
            <div style={{borderLeft:'1px solid var(--line)', background:'rgba(0,0,0,0.15)', padding:20, display:'flex', flexDirection:'column', gap:14}}>
              <div>
                <div className="gg-label" style={{marginBottom:10}}>schema preview</div>
                <div style={{background:'var(--panel)', border:'1px solid var(--line)', borderRadius:8, overflow:'hidden'}}><MiniSchemaPreview/></div>
                <div style={{fontFamily:'var(--mono)', fontSize:11, color:'var(--fg-3)', marginTop:8, textAlign:'center'}}>preview after connect · 47 tables · 132 fkeys</div>
              </div>
              <div>
                <div className="gg-label" style={{marginBottom:10}}>what we read</div>
                <div style={{display:'flex', flexDirection:'column', gap:7}}>
                  {[['table & column metadata',true],['foreign keys & indexes',true],['view definitions',true],['row data / values',false],['stored procedures',true]].map(([label,yes]) => (
                    <div key={label} style={{display:'flex', alignItems:'center', gap:10, fontFamily:'var(--mono)', fontSize:12, color:yes?'var(--fg-2)':'var(--fg-4)'}}>
                      <span style={{width:14, height:14, borderRadius:3, display:'grid', placeItems:'center', background:yes?'rgba(63,185,80,0.12)':'rgba(248,81,73,0.08)', color:yes?'var(--accent)':'var(--danger)', fontSize:9}}>{yes?'✓':'✕'}</span>
                      <span style={{textDecoration:yes?'none':'line-through'}}>{label}</span>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{marginTop:'auto', padding:'12px 14px', background:'rgba(88,166,255,0.06)', border:'1px solid rgba(88,166,255,0.18)', borderRadius:8, fontSize:11.5, lineHeight:1.5, color:'var(--fg-2)'}}>
                <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:6, color:'var(--info)', fontFamily:'var(--mono)', fontSize:11}}><span>ⓘ</span> safe by default</div>
                Connection runs in your browser via WebSocket tunnel. Credentials are encrypted with your local key — they never touch our servers.
              </div>
            </div>
          </div>

          <div style={{marginTop:18, display:'flex', justifyContent:'center', gap:24, fontFamily:'var(--mono)', fontSize:11, color:'var(--fg-3)'}}>
            <span><span className="gg-kbd">tab</span> next field</span>
            <span><span className="gg-kbd">⌘</span><span className="gg-kbd">↵</span> connect</span>
            <span><span className="gg-kbd">esc</span> back</span>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── App router ───────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState('landing');
  const navigate = (to) => setScreen(to);
  return (
    <div className="gg-page" key={screen}>
      {screen === 'landing' && <Landing      onNavigate={navigate}/>}
      {screen === 'repo'    && <RepoSelector onNavigate={navigate}/>}
      {screen === 'db'      && <DBVisualizer onNavigate={navigate}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
