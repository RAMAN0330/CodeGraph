server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /api/ { proxy_pass http://gateway:5000; proxy_http_version 1.1; }
  location /auth/ { proxy_pass http://gateway:5000; proxy_http_version 1.1; }
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires -1;
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|svg|png|jpg|webp|woff2)$ {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    try_files $uri =404;
  }
}
