name: Engine

on:
  push:
    branches: [ "master" ]
    paths: [ "engine/**", ".github/workflows/engine.yml" ]
  pull_request:
    paths: [ "engine/**", ".github/workflows/engine.yml" ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t codegraph-engine engine
      - name: Smoke-test the image
        run: |
          docker run -d --name engine -p 8000:8000 codegraph-engine
          for i in $(seq 1 20); do curl -fsS localhost:8000/health/live && exit 0; sleep 1; done
          docker logs engine; exit 1
