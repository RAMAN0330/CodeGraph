<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>GitGraph — Redesign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="landing.jsx"></script>
  <script type="text/babel" src="repo.jsx"></script>
  <script type="text/babel" src="db.jsx"></script>
  <script type="text/babel" src="explorer.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "screen": "landing",
      "accent": "#3fb950",
      "monoFont": "JetBrains Mono",
      "showGridBg": true,
      "compact": false
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [screen, setScreen] = useState(t.screen || 'landing');

      useEffect(() => {
        document.documentElement.style.setProperty('--accent', t.accent);
        // derive 2/glow from accent
        document.documentElement.style.setProperty('--accent-glow', t.accent + '28');
      }, [t.accent]);

      useEffect(() => {
        if (t.screen && t.screen !== screen) setScreen(t.screen);
      }, [t.screen]);

      const navigate = (s) => {
        setScreen(s);
        setTweak('screen', s);
      };

      return (
        <>
          {screen === 'landing' && <Landing onNavigate={navigate}/>}
          {screen === 'repo' && <RepoSelector onNavigate={navigate}/>}
          {screen === 'db' && <DBVisualizer onNavigate={navigate}/>}
          {screen === 'explorer' && <Explorer onNavigate={navigate}/>}

          {/* Bottom-left view switcher (always visible) */}
          <div className="gg-view-switch">
            <button className={screen === 'landing' ? 'active' : ''} onClick={() => navigate('landing')}>01 landing</button>
            <button className={screen === 'repo' ? 'active' : ''} onClick={() => navigate('repo')}>02 repo selector</button>
            <button className={screen === 'db' ? 'active' : ''} onClick={() => navigate('db')}>03 db visualizer</button>
            <button className={screen === 'explorer' ? 'active' : ''} onClick={() => navigate('explorer')}>04 explorer</button>
          </div>

          <TweaksPanel title="Tweaks">
            <TweakSection label="View"/>
            <TweakRadio label="Screen" value={screen}
              options={[
                { value: 'landing',  label: '01' },
                { value: 'repo',     label: '02' },
                { value: 'db',       label: '03' },
                { value: 'explorer', label: '04' },
              ]}
              onChange={(v) => navigate(v)}/>

            <TweakSection label="Brand"/>
            <TweakColor label="Accent" value={t.accent}
              onChange={(v) => setTweak('accent', v)}/>
            <TweakSelect label="Mono font" value={t.monoFont}
              options={['JetBrains Mono', 'IBM Plex Mono', 'Fira Code', 'Geist Mono']}
              onChange={(v) => {
                setTweak('monoFont', v);
                document.documentElement.style.setProperty('--mono', `'${v}', ui-monospace, monospace`);
                // load font on demand
                if (!document.querySelector(`link[data-font="${v}"]`)) {
                  const link = document.createElement('link');
                  link.rel = 'stylesheet';
                  link.dataset.font = v;
                  link.href = `https://fonts.googleapis.com/css2?family=${v.replace(/ /g, '+')}:wght@400;500;600&display=swap`;
                  document.head.appendChild(link);
                }
              }}/>

            <TweakSection label="Surface"/>
            <TweakToggle label="Grid background" value={t.showGridBg}
              onChange={(v) => {
                setTweak('showGridBg', v);
                document.querySelectorAll('.gg-grid-bg').forEach(el => el.style.display = v ? '' : 'none');
              }}/>
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
